# foot, styled to match HyprDots' kitty config (kitty/kitty.conf + theme.conf):
# Catppuccin Mocha, 25px padding, no bell. Used when kitty isn't installed.

[main]
font=JetBrainsMono Nerd Font:size=9
pad=25x25
term=xterm-256color

[bell]
urgent=no
notify=no
visual=no

[scrollback]
lines=10000

[cursor]
style=block
blink=no

[colors-dark]
alpha=0.92
foreground=cdd6f4
background=1e1e2e
selection-foreground=1e1e2e
selection-background=f5e0dc
cursor=1e1e2e f5e0dc
urls=b4befe

regular0=43465a
regular1=f38ba8
regular2=a6e3a1
regular3=f9e2af
regular4=87b0f9
regular5=f5c2e7
regular6=94e2d5
regular7=cdd6f4

bright0=43465a
bright1=f38ba8
bright2=a6e3a1
bright3=f9e2af
bright4=87b0f9
bright5=f5c2e7
bright6=94e2d5
bright7=a1a8c9
