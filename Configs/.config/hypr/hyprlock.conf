# Lock screen (hyprlock). Replaces swaylock-effects, which is no longer packaged.
# Look carried over from swaylock/config: blurred screenshot, Rosé Pine colors,
# clock and date, ring-style input. https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/
#
# hyprlock still uses the classic hyprlang format, not Lua.

general {
    hide_cursor = true
    ignore_empty_input = true
    grace = 2
}

animations {
    enabled = true
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    animation = fadeIn, 1, 3, easeOutQuint
    animation = fadeOut, 1, 2, easeOutQuint
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    vignette = 0.3
    brightness = 0.7
}

# Time
label {
    monitor =
    text = $TIME12
    color = rgb(e0def4)
    font_size = 72
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 160
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%a, %B %e"
    color = rgba(e0def4cc)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 56
    outline_thickness = 3
    rounding = 14

    outer_color = rgb(191724)
    inner_color = rgba(1f1d2ecc)
    font_color = rgb(e0def4)
    check_color = rgb(eb6f92)
    fail_color = rgb(31748f)
    capslock_color = rgb(f6c177)

    font_family = JetBrainsMono Nerd Font
    placeholder_text = Password
    fail_text = $FAIL ($ATTEMPTS)
    dots_size = 0.25
    dots_spacing = 0.3
    fade_on_empty = false

    position = 0, -40
    halign = center
    valign = center
}
